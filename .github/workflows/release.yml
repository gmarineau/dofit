name: release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      # Maintains a release pull request from the conventional commits on main.
      # Merging it bumps version.txt, writes the changelog, then tags the commit
      # and publishes the GitHub release.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4

  publish:
    name: Publish release image
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag_name }}
      version: ${{ needs.prepare.outputs.version }}
